<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NSF100 Setup">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <title>NSF100 Setup Manager</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1020;color:#f8fafc;margin:0;padding:20px}
    .card{max-width:760px;margin:0 auto;background:#141b2d;border:1px solid #243047;border-radius:16px;padding:18px}
    h1{margin-top:0}.muted{color:#94a3b8}
    label{display:block;margin:10px 0 4px}
    input,select,textarea{width:100%;box-sizing:border-box;padding:10px;border-radius:10px;border:1px solid #334155;background:#0b1220;color:#fff;font-size:16px}
    textarea{min-height:80px}
    button{margin-top:14px;padding:12px 16px;border:0;border-radius:12px;background:#38bdf8;color:#001018;font-weight:700;font-size:16px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .record{margin-top:12px;padding:12px;background:#0f172a;border-radius:12px;border:1px solid #243047}
    @media(max-width:640px){.row{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="card">
    <h1>NSF100 Setup Manager</h1>
    <p class="muted">iPhone / iPad対応の簡易セッティング管理</p>

    <div class="row">
      <div><label>日付</label><input id="date" type="date"></div>
      <div><label>コース</label>
        <select id="circuit">
          <option>近畿スポーツランド</option>
          <option>堺カートランド</option>
          <option>名阪スポーツランド</option>
          <option>その他</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div><label>気温 [℃]</label><input id="air" type="number" step="0.1"></div>
      <div><label>路温 [℃]</label><input id="track" type="number" step="0.1"></div>
      <div><label>湿度 [%]</label><input id="humidity" type="number"></div>
      <div><label>気圧 [hPa]</label><input id="pressure" type="number"></div>
    </div>

    <div class="row">
      <div><label>Fタイヤ</label><input id="ftire" value="CST"></div>
      <div><label>F温間空気圧</label><input id="fp" type="number" step="0.05" value="2.00"></div>
      <div><label>Rタイヤ</label><input id="rtire" value="BT601"></div>
      <div><label>R温間空気圧</label><input id="rp" type="number" step="0.05"></div>
    </div>

    <div class="row">
      <div><label>F突き出し [mm]</label><input id="fprot" type="number" step="0.5" value="6"></div>
      <div><label>F油面 [mm]</label><input id="foil" type="number" step="1" value="75"></div>
      <div><label>R車高 [mm]</label><input id="rh" type="number" step="0.5" value="221"></div>
      <div><label>Rイニシャル [回転]</label><input id="rpre" type="number" step="0.25" value="3"></div>
    </div>

    <div class="row">
      <div><label>R伸び側</label><input id="reb" type="number" step="1" value="2"></div>
      <div><label>R圧側</label><input id="comp" type="number" step="1" value="0"></div>
      <div><label>MJ</label><input id="mj" value="105"></div>
      <div><label>SJ</label><input id="sj" value="27.5"></div>
    </div>

    <div class="row">
      <div><label>ベストラップ</label><input id="best"></div>
      <div><label>最高速 [km/h]</label><input id="maxs" type="number" step="0.1"></div>
    </div>

    <label>症状</label><textarea id="sym"></textarea>
    <label>変更内容</label><textarea id="chg"></textarea>
    <label>結果</label><textarea id="res"></textarea>
    <label>次に試すこと</label><textarea id="next"></textarea>

    <button id="save">保存</button>

    <h2>履歴</h2>
    <div id="list"></div>
  </div>

<script>
const KEY="nsf100_pwa_records_v1";
const ids=["date","circuit","air","track","humidity","pressure","ftire","fp","rtire","rp","fprot","foil","rh","rpre","reb","comp","mj","sj","best","maxs","sym","chg","res","next"];
function load(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){return []}}
function saveAll(x){localStorage.setItem(KEY,JSON.stringify(x))}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function render(){
  const list=document.getElementById("list"), data=load();
  list.innerHTML=data.length?data.map((r,i)=>`<div class="record"><b>${esc(r.date)} ${esc(r.circuit)}</b><br>
  Best: ${esc(r.best||"-")} / F ${esc(r.ftire)} ${esc(r.fp)} / R ${esc(r.rtire)} ${esc(r.rp||"-")}<br>
  F突 ${esc(r.fprot)} / 油面 ${esc(r.foil)} / R車高 ${esc(r.rh)} / Rイニシャル ${esc(r.rpre)}<br>
  MJ${esc(r.mj)} SJ${esc(r.sj)}<br>
  ${r.res?`結果: ${esc(r.res)}`:""}
  </div>`).join(""):'<p class="muted">まだ記録がありません。</p>';
}
document.getElementById("date").value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
document.getElementById("save").onclick=()=>{
  const r={}; ids.forEach(id=>r[id]=document.getElementById(id).value);
  const a=load(); a.unshift(r); saveAll(a); render(); alert("保存しました");
};
render();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"))}
</script>
</body>
</html>
